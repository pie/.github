name: "Deploy via FTP"
description: "Uploads files to a remote server via FTP"
inputs:
  ftp-host:
    description: "FTP server to connect to"
    required: true
  ftp-username:
    description: "FTP username to connect with"
    required: true
  ftp-port:
    description: "FTP port to connect to"
    required: false
    default: 21
  ftp-password:
    description: "FTP password"
    required: true
  ftp-exclude:
    description: "Files to exclude"
    required: false
    default: |
      **/.git*
      **/.git*/**
      **/node_modules/**
  destination-path:
    description: "Destination path to copy files"
    required: true
  composer:
    description: "Run composer install"
    required: false
    default: "false"
  php-version:
    description: "PHP version to run composer install with"
    required: false
    default: "8.5"
  php-extensions:
    description: "PHP extensions to install for composer install (comma-separated)"
    required: false
    default: "mbstring"
  npm:
    description: "Run npm install and build"
    required: false
    default: "false"
  node_version:
    description: "Node version to use"
    required: false
    default: "18"

runs:
  using: "composite"
  steps:
    - name: Check out the Repo
      uses: actions/checkout@v7

    # Pins PHP rather than using whatever is newest: PHP 8.6's official images
    # left out mbstring, which broke composer install for packages that need it.
    - name: Set up PHP if required
      if: ${{inputs.composer == 'true' }}
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{inputs.php-version}}
        extensions: ${{inputs.php-extensions}}
        tools: composer:v2
        coverage: none

    - name: Install Composer Dependencies if required
      if: ${{inputs.composer == 'true' }}
      run: composer install --no-dev --no-interaction --no-progress --optimize-autoloader --prefer-dist
      shell: bash
        
    - name: Install Node Dependencies if required
      if: ${{inputs.npm == 'true' }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node_version || matrix.node }}

    - name: Install dependencies and build
      if: ${{inputs.npm == 'true' }}
      run: npm install && npm run build
      shell: bash
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ inputs.ftp-host }}
        username: ${{ inputs.ftp-username }}
        password: ${{ inputs.ftp-password }}
        port: ${{ inputs.ftp-port }}
        server-dir: ${{ inputs.destination-path }}
        timeout: 60000
        log-level: verbose
        exclude: ${{ inputs.ftp-exclude }}